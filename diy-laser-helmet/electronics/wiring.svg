<text x='760' y='484' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' font-weight='normal' fill='#1f2430'>1. Push every module in from the outside until it stops.</text>
<text x='760' y='502' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' font-weight='normal' fill='#1f2430'>2. Run a red and a black 24 AWG wire along the outer face.</text>
<text x='760' y='520' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' font-weight='normal' fill='#1f2430'>3. Window-strip 5 mm at each module, twist the lead on, solder.</text>
<text x='760' y='538' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' font-weight='normal' fill='#1f2430'>4. Cut leads to ~3 cm first. Sleeve or tape every joint.</text>
<rect x='740' y='586' width='440' height='130' rx='12' fill='#fff' stroke='#c9cfdb' stroke-width='1.5'/>
<text x='760' y='612' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' text-anchor='start' font-weight='bold' fill='#1f2430'>Wire sizes</text>
<text x='760' y='636' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' font-weight='normal' fill='#1f2430'>Rib pair (&lt;= 12 modules, 0.3 A)</text>
<text x='1160' y='636' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='end' font-weight='bold' fill='#1f2430'>24-26 AWG</text>
<text x='760' y='656' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' font-weight='normal' fill='#1f2430'>Spine bus (up to 2.8 A)</text>
<text x='1160' y='656' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='end' font-weight='bold' fill='#1f2430'>18-20 AWG</text>
<text x='760' y='676' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' font-weight='normal' fill='#1f2430'>Helmet -&gt; controller cable</text>
<text x='1160' y='676' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='end' font-weight='bold' fill='#1f2430'>18 AWG, short</text>
<text x='760' y='696' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' font-weight='normal' fill='#1f2430'>HEAD wire (interlock)</text>
